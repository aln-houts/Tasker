<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bubble To-Do</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app" aria-label="Bubble To-Do App">
    <header class="topbar">
      <div class="topbar-left">
        <div class="app-title">To-Do</div>
        <div class="app-subtitle">chat-style checklist</div>
      </div>

      <div class="topbar-actions">
        <button id="clearCompletedBtn" class="ghost" type="button" title="Clear completed">
          Clear Completed
        </button>
      </div>
    </header>

    <section class="thread" aria-label="To-do thread">
      <div class="thread-inner">
        <div class="section-title">Active</div>
        <div id="activeList" class="bubble-list" role="list"></div>

        <div class="divider"></div>

        <div class="section-title completed-title">Completed</div>
        <div id="completedList" class="bubble-list completed" role="list"></div>
      </div>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label class="sr-only" for="taskInput">New task</label>

      <div class="composer-shell">
        <input
          id="taskInput"
          name="task"
          type="text"
          placeholder="Message…"
          maxlength="240"
          inputmode="text"
          enterkeyhint="send"
          required
        />
        <button class="send" type="submit" aria-label="Send">
          ➤
        </button>
      </div>
    </form>
  </main>

  <script src="./app.js"></script>
</body>
</html>
