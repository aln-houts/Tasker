<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bubble To-Do</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app" aria-label="Bubble To-Do App">
    <header class="topbar">
      <div class="topbar-left">
        <div class="app-title">To-Do</div>
        <div class="app-subtitle" id="taskCount">0 active · 0 done</div>
      </div>

      <div class="topbar-actions">
        <button id="dailyToggleBtn" class="ghost" type="button" title="Toggle daily tasks">
          📋 Daily
        </button>
        <button id="backupBtn" class="ghost" type="button" title="Export backup">
          ↑ Export
        </button>
        <button id="importBtn" class="ghost" type="button" title="Import backup">
          ↓ Import
        </button>
        <input id="importFileInput" type="file" accept=".json" style="display:none" />
        <button id="clearCompletedBtn" class="ghost" type="button" title="Clear completed">
          Clear ✓
        </button>
      </div>
    </header>

    <section class="thread" aria-label="To-do thread">
      <div class="thread-inner">
        <div class="section-title">Active</div>
        <div id="activeList" class="bubble-list" role="list"></div>

        <div class="divider"></div>

        <div class="section-title completed-title">Completed</div>
        <div id="completedList" class="bubble-list completed" role="list"></div>
      </div>
    </section>

    <form id="composer" class="composer" autocomplete="off">
      <label class="sr-only" for="taskInput">New task</label>

      <div class="composer-shell">
        <select id="categorySelect" class="category-select" aria-label="Task category">
          <option value="personal">👤 Personal</option>
          <option value="daily">📋 Daily</option>
          <option value="project">📁 Project</option>
          <option value="event">📅 Event</option>
        </select>
        <input
          id="taskInput"
          name="task"
          type="text"
          placeholder="Message…"
          maxlength="240"
          inputmode="text"
          enterkeyhint="send"
          required
        />
        <button class="send" type="submit" aria-label="Send">
          ➤
        </button>
      </div>
    </form>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
